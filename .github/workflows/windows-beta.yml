name: Beta Windows x64

on:
    pull_request:
    push:
        branches: [main, master]
        tags: ['v*']
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: windows-beta-${{ github.ref }}
    cancel-in-progress: true

jobs:
    windows:
        runs-on: windows-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v6
              with:
                  node-version: '22.17.0'
                  cache: npm
            - name: Conferir versão da tag
              if: startsWith(github.ref, 'refs/tags/')
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: node -e "if (process.env.RELEASE_TAG !== 'v' + require('./package.json').version) process.exit(1)"
            - run: npm ci
            - run: npm run typecheck
            - run: npm run lint
            - name: Conferir formatação da infraestrutura de release
              run: npx --no-install prettier --check .github/workflows/windows-beta.yml package.json electron-builder.json scripts/*.cjs scripts/*.mjs scripts/qa/* security/*.json tests/integration/release-checksums.test.ts tests/integration/audit-production.test.ts docs/RELEASE.md docs/QA_RELEASE.md docs/SECURITY_REVIEW.md docs/AUTO_UPDATES.md docs/releases/*.md
            - run: npm test -- --runInBand
            - name: Compilar e homologar transferência e interface
              run: npm run qa:release
            - name: Guardar evidências de homologação
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: meshy-qa-${{ github.sha }}
                  path: |
                      .build-resources/qa/run-*/*-report.json
                      .build-resources/qa/run-*/*.png
                      .build-resources/qa/run-*/*.log
                  include-hidden-files: true
                  if-no-files-found: ignore
                  retention-days: 14
            - name: Gerar candidato para homologação
              if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
              run: npm run dist:win
            - name: Registrar assinatura do candidato
              if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
              shell: pwsh
              run: |
                  $candidate = Get-ChildItem -LiteralPath dist -Filter '*-win-x64-setup.exe'
                  if ($candidate.Count -ne 1) { throw 'Instalador único não encontrado' }
                  $signature = Get-AuthenticodeSignature -LiteralPath $candidate.FullName
                  Write-Output ('Assinatura do candidato: ' + $signature.Status)
            - name: Guardar instalador e SHA-256
              if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
              uses: actions/upload-artifact@v6
              with:
                  name: meshy-windows-x64-${{ github.sha }}
                  path: |
                      dist/*-win-x64-setup.exe
                      dist/*-win-x64-setup.exe.blockmap
                      dist/latest.yml
                      dist/SHA256SUMS
                  if-no-files-found: error
                  retention-days: 14
                  compression-level: 0

    audit:
        name: Auditoria de produção
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v6
              with:
                  node-version: '22.17.0'
                  cache: npm
            - run: npm ci --ignore-scripts
            - run: npm run security:audit
            - name: Guardar relatório bruto de auditoria
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: meshy-audit-${{ github.sha }}
                  path: .build-resources/security/audit-production.json
                  include-hidden-files: true
                  if-no-files-found: ignore
                  retention-days: 14
